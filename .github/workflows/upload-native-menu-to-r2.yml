name: Upload Native Menu to R2

on:
  push:
    branches:
      - main
    paths:
      - Native menu.lua

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload Native menu.lua to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
        run: |
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_BUCKET" ]]; then
            echo "::error::Set the CLOUDFLARE_R2_ACCOUNT_ID and CLOUDFLARE_R2_BUCKET repository variables."
            exit 1
          fi

          aws s3 cp "Native menu.lua" "s3://${R2_BUCKET}/Native_menu.lua" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto \
            --only-show-errors
